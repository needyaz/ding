name: Ding
options:
  bundleIdPrefix: blue.luci
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 46XLY7Y9P8
    # The one name the bundle IDs and the app group derive from. A copy of Ding overrides it (and the team): see README.
    DING_BUNDLE_ID: blue.luci.Ding
# Third-party packages are pinned to the exact versions that were reviewed; bump them on purpose.
packages:
  DingCore:
    path: .
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    exactVersion: 1.3.1
targets:
  Ding:
    type: application
    platform: macOS
    sources:
      - Ding
    dependencies:
      - package: DingCore
      - package: DingCore
        product: DingIPC
      - package: KeyboardShortcuts
      - package: MenuBarExtraAccess
      # The MCP helper ships inside the app bundle, so every install has it.
      - target: ding-mcp
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Ding/Info.plist
      properties:
        CFBundleDisplayName: Ding
        # Read from the build settings so a release can stamp the build number (the commit count).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMultipleInstancesProhibited: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: Ding reads your calendar to show your next meeting and let you join it in one click. Your calendar stays on this Mac unless you let an AI assistant see it.
        NSCalendarsUsageDescription: Ding reads your calendar to show your next meeting and let you join it in one click. Your calendar stays on this Mac unless you let an AI assistant see it.
        ITSAppUsesNonExemptEncryption: false
        DingAppGroup: $(TeamIdentifierPrefix)$(DING_BUNDLE_ID)
    entitlements:
      path: Ding/Ding.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(DING_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DING_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - DingTests
      gatherCoverageData: true
  DingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DingTests
    dependencies:
      - target: Ding
      - package: DingCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(DING_BUNDLE_ID)Tests
  ding-mcp:
    type: tool
    platform: macOS
    sources:
      - DingMCPHelper
    dependencies:
      - package: DingCore
        product: DingIPC
      - package: DingCore
        product: DingMCP
    info:
      path: DingMCPHelper/Info.plist
      properties:
        CFBundleName: ding-mcp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        DingAppGroup: $(TeamIdentifierPrefix)$(DING_BUNDLE_ID)
    entitlements:
      path: DingMCPHelper/DingMCP.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)$(DING_BUNDLE_ID)
    settings:
      base:
        PRODUCT_NAME: ding-mcp
        PRODUCT_BUNDLE_IDENTIFIER: $(DING_BUNDLE_ID).mcp
        GENERATE_INFOPLIST_FILE: NO
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
